plugins {
    id 'com.android.application'
}

android {
    namespace 'cr.jlepiz.mattelauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'cr.jlepiz.mattelauncher'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    buildFeatures {
        buildConfig true
    }
    flavorDimensions 'edition'
    productFlavors {
        full {
            dimension 'edition'
            manifestPlaceholders = [launcherLabel: 'Matte Launcher']
            buildConfigField 'boolean', 'MESSAGE_PREVIEWS', 'true'
            buildConfigField 'boolean', 'WEATHER_ENABLED', 'true'
        }
        lite {
            dimension 'edition'
            applicationIdSuffix '.lite'
            manifestPlaceholders = [launcherLabel: 'Matte Launcher Lite']
            buildConfigField 'boolean', 'MESSAGE_PREVIEWS', 'false'
            buildConfigField 'boolean', 'WEATHER_ENABLED', 'true'
        }
        basic {
            dimension 'edition'
            applicationIdSuffix '.basic'
            manifestPlaceholders = [launcherLabel: 'Matte Launcher Básico']
            buildConfigField 'boolean', 'MESSAGE_PREVIEWS', 'false'
            buildConfigField 'boolean', 'WEATHER_ENABLED', 'false'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
