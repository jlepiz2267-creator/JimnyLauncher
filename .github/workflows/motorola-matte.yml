name: Compilar Matte Launcher APK

on:
  push:
    branches:
      - 'feature/motorola-matte-launcher'
    paths:
      - 'MotorolaMatte/**'
      - '.github/workflows/motorola-matte.yml'
  pull_request:
    paths:
      - 'MotorolaMatte/**'
      - '.github/workflows/motorola-matte.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar Matte Launcher
        working-directory: MotorolaMatte
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Subir APK instalable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MatteLauncher-debug-apk
          path: MotorolaMatte/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
