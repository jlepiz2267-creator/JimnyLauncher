name: Compilar y verificar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --stacktrace
      - name: Auditar permisos, firma y hash
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$APK"
          {
            echo "Jimny Launcher - verificacion de APK"
            echo "Compilacion: $GITHUB_SHA"
            echo "SHA-256:"
            sha256sum "$APK"
            echo
            echo "Firma digital (APK de depuracion):"
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "Permisos declarados:"
            "$TOOLS/aapt" dump permissions "$APK"
          } | tee apk-verificacion.txt
          if "$TOOLS/aapt" dump permissions "$APK" | grep -E 'uses-permission:'; then
            echo "ERROR: El APK declara permisos; revisar antes de distribuir."
            exit 1
          fi
      - name: Publicar APK y reporte de verificacion
        uses: actions/upload-artifact@v4
        with:
          name: JimnyLauncher-debug-verificado
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-verificacion.txt
