name: APK de distribución firmado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Comprobar secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.JIMNY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JIMNY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JIMNY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JIMNY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Faltan secretos de firma. No se generará un APK de distribución sin firma privada."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jimny-release.jks"
          chmod 600 "$RUNNER_TEMP/jimny-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/jimny-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Compilar y probar versión release
        run: gradle :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --stacktrace
      - name: Firmar, verificar y auditar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.JIMNY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JIMNY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JIMNY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/JimnyLauncher-release-signed.apk
          test -s "$UNSIGNED"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/jimny-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$SIGNED" "$RUNNER_TEMP/aligned.apk"
          {
            echo "Jimny Launcher - firma de distribución"
            echo "Commit: $GITHUB_SHA"
            sha256sum "$SIGNED"
            "$TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
            "$TOOLS/aapt" dump permissions "$SIGNED"
          } > release-verificacion.txt
          if "$TOOLS/aapt" dump permissions "$SIGNED" | grep -E 'uses-permission:'; then
            echo "::error::Se detectaron permisos declarados; revisar antes de distribuir"
            exit 1
          fi
          cat release-verificacion.txt
      - name: Publicar APK firmado y reporte
        uses: actions/upload-artifact@v4
        with:
          name: JimnyLauncher-release-firmado
          path: |
            app/build/outputs/apk/release/JimnyLauncher-release-signed.apk
            release-verificacion.txt
          retention-days: 14
      - name: Borrar material de firma temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/jimny-release.jks" "$RUNNER_TEMP/aligned.apk"
